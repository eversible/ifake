<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iFake Pro has moved</title>
<noscript><meta http-equiv="refresh" content="0; url=../pro/"></noscript>
<script>
  // iFake Pro moved to ../pro/: drop the offline copy kept for this old address, then go there
  const go = () => location.replace('../pro/' + location.search + location.hash);
  const drop = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations()
    .then((rs) => Promise.all(rs.filter((r) => new URL(r.scope).pathname.endsWith('/lead-sheet/')).map((r) => r.unregister())))
    .catch(() => {}) : Promise.resolve();
  Promise.race([drop, new Promise((r) => setTimeout(r, 600))]).then(go, go);
</script>
</head>
<body style="margin:0;padding:24px;font:17px -apple-system,BlinkMacSystemFont,sans-serif;background:#1c1c1e;color:#f2f2f7">
  iFake Pro has moved to <a href="../pro/" style="color:#0a84ff">its new address</a>.
</body>
</html>
