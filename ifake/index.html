<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iFake">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>iFake</title>
<link rel="stylesheet" href="css/app.css?v=079ba879d8">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="tb" id="btn-charts" aria-label="Charts">☰</button>
    <div id="title" role="button" tabindex="0">Untitled</div>
    <button class="tb" id="btn-settings" aria-label="Settings">⚙︎</button>
  </header>

  <main id="chart-wrap">
    <div id="grid" aria-label="Chord chart"></div>
  </main>

  <section id="info" role="button" aria-label="Hear the selected chord">
    <span class="info-hear" aria-hidden="true">♪</span>
    <div id="info-text">
      <div id="info-chord">—</div>
      <div id="info-notes"></div>
    </div>
    <svg id="piano" viewBox="0 0 280 44" preserveAspectRatio="none" aria-hidden="true"></svg>
  </section>

  <div id="typebar" hidden>
    <input id="type-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="C-7b9  or  D-7 G7 | CΔ7" enterkeyhint="done">
    <button id="type-go">Enter</button>
    <button id="type-close" aria-label="Close typing">✕</button>
    <div id="type-msg"></div>
  </div>

  <div id="transport">
    <button id="loop-chip" aria-label="Loop on or off"><span class="lc-icon">⟲</span><span class="lc-text"><span class="lc-main">Loop</span><span class="lc-sub"></span></span></button>
    <div id="tempo">
      <button id="tempo-down" aria-label="Slower (hold to repeat)">−</button>
      <button id="bpm" aria-label="Tempo; tap in time to set it"><span id="bpm-val">120</span><small>TAP</small></button>
      <button id="tempo-up" aria-label="Faster (hold to repeat)">+</button>
    </div>
    <button id="btn-play" aria-label="Play">▶</button>
  </div>

  <nav id="keyboard" aria-label="Chord keyboard"></nav>
</div>

<div id="toast" role="status"></div>

<div class="sheet" id="sheet-settings" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2>Settings</h2><button class="close" data-close>Done</button></div>
    <div class="sheet-body" id="settings-body"></div>
  </div>
</div>

<div class="sheet" id="sheet-charts" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2>Charts</h2><button class="close" data-close>Done</button></div>
    <div class="sheet-body" id="charts-body"></div>
  </div>
</div>

<script type="importmap">{"imports": {"./js/app.js": "./js/app.js?v=8fc3eb80aa", "./js/audio.js": "./js/audio.js?v=5057f08e7a", "./js/chords.js": "./js/chords.js?v=5fb7131653", "./js/form.js": "./js/form.js?v=8150dd6c2c", "./js/store.js": "./js/store.js?v=4769d0f668", "./js/voicing.js": "./js/voicing.js?v=e6563af0b1"}}</script>
<script type="module" src="js/app.js?v=8fc3eb80aa"></script>
</body>
</html>
